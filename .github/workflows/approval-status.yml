name: Approval status
on:
  pull_request:
    paths:
      - 'web/app/src/approvalWatch.ts'
      - 'web/app/src/UrbitSignIn.tsx'
      - 'web/app/src/main.tsx'
      - 'web/app/src/api.ts'
      - 'web/app/tests/approval-status.mjs'
      - 'web/app/package*.json'
      - '.github/workflows/approval-status.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check && npm run build
      - run: ./node_modules/.bin/playwright install chromium --with-deps
      - run: node tests/approval-status.mjs "$RUNNER_TEMP/approval-images"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: synthetic-approval
          path: ${{ runner.temp }}/approval-images/*.png
          if-no-files-found: ignore
          retention-days: 7
