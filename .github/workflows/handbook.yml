name: Stead Handbook
on:
  pull_request:
    paths:
      - 'web/app/src/**'
      - 'web/app/build.mjs'
      - 'web/app/tests/handbook.mjs'
      - 'web/app/handbook-repository.py'
      - 'web/app/tests/handbook-repository.mjs'
      - '.github/workflows/handbook.yml'
permissions:
  contents: read
jobs:
  handbook:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 handbook-repository.py && node tests/handbook-repository.mjs
      - run: npm run check && npm run build
      - run: ./node_modules/.bin/playwright install chromium --with-deps
      - run: node tests/handbook.mjs
