name: Isolated native CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Reviewed native inspection, fixed model proof, or fixed repository/model-codec evaluator
        required: true
        default: native
        type: choice
        options: [native, model, pure, pure-model-simple, pure-repository-debug, home-assets-saved8]
      candidate:
        description: Full candidate commit from this repository; blank tests the pinned reviewed controller
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: stead-manual-native-ci
  cancel-in-progress: false

jobs:
  native:
    if: github.repository_id == '1367847927' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.mode == 'model' || inputs.mode == 'pure' || inputs.mode == 'pure-model-simple' || inputs.mode == 'pure-repository-debug') && 30 || 125 }}
    steps:
      - name: Capture the reviewed controller and candidate data
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_CANDIDATE: ${{ inputs.candidate }}
          STEAD_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          sudo --preserve-env=STEAD_WORKFLOW,STEAD_CANDIDATE,STEAD_MODE python3 -I -B - <<'PY'
          import json, os, pathlib, re, subprocess
          workflow = os.environ['STEAD_WORKFLOW']
          if not re.fullmatch(r'[0-9a-f]{40}', workflow):
              raise SystemExit('Full immutable commits required')
          for location in ('/', '/opt', '/var', '/var/lib'):
              info = pathlib.Path(location).lstat()
              print(json.dumps({'ancestor': location, 'uid': info.st_uid, 'gid': info.st_gid, 'mode': oct(info.st_mode & 0o7777)}), flush=True)
          root = pathlib.Path('/var/lib/stead-ci-controller')
          root.mkdir(mode=0o755)
          env = {'PATH': '/usr/bin:/bin', 'LANG': 'C.UTF-8', 'GIT_CONFIG_NOSYSTEM': '1',
                 'GIT_CONFIG_GLOBAL': '/dev/null', 'GIT_TERMINAL_PROMPT': '0', 'GIT_NO_REPLACE_OBJECTS': '1'}
          def git(*args):
              return subprocess.run(['/usr/bin/git', '-C', str(root), *args], env=env, check=True, timeout=120, stdout=subprocess.PIPE).stdout
          git('init', '--initial-branch=controller')
          git('remote', 'add', 'origin', 'https://github.com/ScottTpirate/stead-urbit.git')
          git('fetch', '--no-tags', '--depth=1', 'origin', workflow)
          raw = git('show', workflow + ':specs/urbit/hosted-ci-controller.json')
          if len(raw) > 4096:
              raise SystemExit('Controller manifest too large')
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit('Duplicate controller manifest field')
                  result[key] = value
              return result
          manifest = json.loads(raw, object_pairs_hook=unique)
          controller = manifest.get('controller_commit', '')
          if manifest != {'format': 'stead.hosted-controller/1', 'repository': 'ScottTpirate/stead-urbit', 'controller_commit': controller}:
              raise SystemExit('Invalid controller manifest')
          mode = os.environ.get('STEAD_MODE') or 'native'
          if mode not in ('native', 'model', 'pure', 'pure-model-simple', 'pure-repository-debug', 'home-assets-saved8') or (mode in ('model', 'pure', 'pure-model-simple', 'pure-repository-debug', 'home-assets-saved8') and os.environ.get('STEAD_CANDIDATE')):
              raise SystemExit('Fixed standalone modes accept no candidate override')
          candidate = os.environ.get('STEAD_CANDIDATE') or controller
          if not all(re.fullmatch(r'[0-9a-f]{40}', value) for value in (controller, candidate)):
              raise SystemExit('Full immutable commits required')
          git('fetch', '--no-tags', '--depth=1', 'origin', controller, candidate)
          git('checkout', '--detach', controller)
          (root / '.runtime').mkdir(mode=0o700)
          (root / '.runtime/candidate').write_text(candidate + '\n')
          (root / '.runtime/controller').write_text(controller + '\n')
          PY
      - name: Provision the exact Git corpus version on the disposable VM
        if: inputs.mode != 'model' && inputs.mode != 'pure' && inputs.mode != 'pure-model-simple' && inputs.mode != 'pure-repository-debug'
        timeout-minutes: 15
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y build-essential libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev
          python3 -I -B - <<'PY'
          import hashlib, json, pathlib, subprocess, tarfile, tempfile, urllib.request
          # Official archive checksum: https://www.kernel.org/pub/software/scm/git/sha256sums.asc
          version = '2.55.0'
          expected = '457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357'
          url = 'https://www.kernel.org/pub/software/scm/git/git-' + version + '.tar.xz'
          with tempfile.TemporaryDirectory(prefix='stead-git-build-') as directory:
              root = pathlib.Path(directory)
              archive = root / 'git.tar.xz'
              with urllib.request.urlopen(url, timeout=60) as response:
                  raw = response.read(16 * 1024 * 1024 + 1)
              if len(raw) > 16 * 1024 * 1024 or hashlib.sha256(raw).hexdigest() != expected:
                  raise SystemExit('Pinned Git source archive differs')
              archive.write_bytes(raw)
              with tarfile.open(archive) as source:
                  members = source.getmembers()
                  if len(members) > 16000 or sum(member.size for member in members) > 160 * 1024 * 1024:
                      raise SystemExit('Git source extraction bound')
                  if any(not (member.name.startswith('git-' + version + '/')
                              or (member.name == 'git-' + version and member.isdir())) for member in members):
                      raise SystemExit('Git source root differs')
                  source.extractall(root, filter='data')
              source = root / ('git-' + version)
              options = ['prefix=/usr', 'gitexecdir=/usr/lib/git-core', 'NO_RUST=1', 'NO_TCLTK=1', 'NO_GETTEXT=1']
              subprocess.run(['make', '-j2', *options, 'all'], cwd=source, check=True, timeout=600)
              subprocess.run(['sudo', 'make', '-j2', *options, 'install'], cwd=source, check=True, timeout=120)
          observed = subprocess.check_output(['/usr/bin/git', '--version'], text=True).strip()
          if observed != 'git version ' + version:
              raise SystemExit('Installed Git version differs')
          helpers = subprocess.check_output(['/usr/bin/git', '--exec-path'], text=True).strip()
          if helpers != '/usr/lib/git-core' or not pathlib.Path(helpers, 'git-remote-https').is_file():
              raise SystemExit('Installed Git helper path differs')
          print(json.dumps({'source_url': url, 'source_sha256': expected, 'git': observed,
              'git_exec_path': helpers, 'build_options': options}))
          PY
      - name: Install the disposable VM dependency and verify pinned downloads
        if: inputs.mode != 'model' && inputs.mode != 'pure' && inputs.mode != 'pure-model-simple' && inputs.mode != 'pure-repository-debug'
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap
          dpkg-query --show --showformat='${Package} ${Version}\n' bubblewrap
          sudo env PATH=/usr/bin:/bin python3 -I -B - <<'PY'
          import runpy, sys
          sys.path.insert(0, '/var/lib/stead-ci-controller/scripts/urbit')
          sys.argv = ['toolchain.py', 'fetch']
          runpy.run_path('/var/lib/stead-ci-controller/scripts/urbit/toolchain.py', run_name='__main__')
          PY
      - name: Install the fixed standalone namespace dependency
        if: inputs.mode == 'model' || inputs.mode == 'pure' || inputs.mode == 'pure-model-simple' || inputs.mode == 'pure-repository-debug'
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap
          dpkg-query --show --showformat='${Package} ${Version}\n' bubblewrap
      - name: Record namespace prerequisites
        run: |
          sudo python3 -I -B - <<'PY'
          import json, pathlib
          def bounded(path, maximum):
              with path.open() as source:
                  text = source.read(maximum + 1)
              if len(text) > maximum:
                  raise SystemExit('Platform observation exceeds bound: ' + str(path))
              return text
          for name in ('/proc/sys/kernel/apparmor_restrict_unprivileged_userns', '/proc/sys/kernel/apparmor_restrict_unprivileged_unconfined', '/etc/apparmor.d/bwrap'):
              path = pathlib.Path(name)
              print(json.dumps({'path': name, 'text': bounded(path, 8192) if path.is_file() else None}))
          for name in ('/usr/bin/ip', '/usr/sbin/ip', '/usr/bin/nft', '/usr/sbin/nft'):
              path = pathlib.Path(name)
              print(json.dumps({'path': name, 'exists': path.is_file(), 'resolved': str(path.resolve())}))
          profiles = bounded(pathlib.Path('/sys/kernel/security/apparmor/profiles'), 1048576)
          print(json.dumps({'bwrap_profiles': [line for line in profiles.splitlines() if 'bwrap' in line][:16]}))
          PY
      - name: Authenticate admission and prove owned failure cleanup
        if: inputs.mode != 'model' && inputs.mode != 'pure' && inputs.mode != 'pure-model-simple' && inputs.mode != 'pure-repository-debug'
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_RUN_ID: ${{ github.run_id }}
          STEAD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          candidate=$(sudo cat /var/lib/stead-ci-controller/.runtime/candidate)
          controller=$(sudo cat /var/lib/stead-ci-controller/.runtime/controller)
          for control in missing-profile wrong-profile parent-death guardian-death changed-limits stale-lease; do
            sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN python3 -I -B /var/lib/stead-ci-controller/scripts/ci/hosted.py --workflow "$STEAD_WORKFLOW" --controller "$controller" --candidate "$candidate" --run-id "$STEAD_RUN_ID" --attempt "$STEAD_ATTEMPT" --control "$control"
          done
      - name: Execute the isolated native job
        if: inputs.mode != 'model' && inputs.mode != 'pure' && inputs.mode != 'pure-model-simple' && inputs.mode != 'pure-repository-debug' && inputs.mode != 'home-assets-saved8'
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_RUN_ID: ${{ github.run_id }}
          STEAD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          candidate=$(sudo cat /var/lib/stead-ci-controller/.runtime/candidate)
          controller=$(sudo cat /var/lib/stead-ci-controller/.runtime/controller)
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN python3 -I -B /var/lib/stead-ci-controller/scripts/ci/hosted.py --workflow "$STEAD_WORKFLOW" --controller "$controller" --candidate "$candidate" --run-id "$STEAD_RUN_ID" --attempt "$STEAD_ATTEMPT"
      - name: Execute the fixed disposable saved8 asset rehearsal
        if: inputs.mode == 'home-assets-saved8'
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_RUN_ID: ${{ github.run_id }}
          STEAD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          controller=$(sudo cat /var/lib/stead-ci-controller/.runtime/controller)
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN python3 -I -B /var/lib/stead-ci-controller/scripts/ci/hosted.py --workflow "$STEAD_WORKFLOW" --controller "$controller" --candidate "$controller" --run-id "$STEAD_RUN_ID" --attempt "$STEAD_ATTEMPT" --mode home-assets-saved8
      - name: Execute the fixed standalone model proof
        if: inputs.mode == 'model'
        timeout-minutes: 24
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_RUN_ID: ${{ github.run_id }}
          STEAD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          controller=$(sudo cat /var/lib/stead-ci-controller/.runtime/controller)
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN python3 -I -B /var/lib/stead-ci-controller/scripts/ci/hosted.py --workflow "$STEAD_WORKFLOW" --controller "$controller" --candidate "$controller" --run-id "$STEAD_RUN_ID" --attempt "$STEAD_ATTEMPT" --mode model
      - name: Execute the fixed pure evaluator
        if: inputs.mode == 'pure'
        timeout-minutes: 24
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_RUN_ID: ${{ github.run_id }}
          STEAD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          controller=$(sudo cat /var/lib/stead-ci-controller/.runtime/controller)
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN python3 -I -B /var/lib/stead-ci-controller/scripts/ci/hosted.py --workflow "$STEAD_WORKFLOW" --controller "$controller" --candidate "$controller" --run-id "$STEAD_RUN_ID" --attempt "$STEAD_ATTEMPT" --mode pure
      - name: Execute the fixed model-codec evaluator
        if: inputs.mode == 'pure-model-simple'
        timeout-minutes: 24
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_RUN_ID: ${{ github.run_id }}
          STEAD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          controller=$(sudo cat /var/lib/stead-ci-controller/.runtime/controller)
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN python3 -I -B /var/lib/stead-ci-controller/scripts/ci/hosted.py --workflow "$STEAD_WORKFLOW" --controller "$controller" --candidate "$controller" --run-id "$STEAD_RUN_ID" --attempt "$STEAD_ATTEMPT" --mode pure-model-simple
      - name: Execute the fixed catalog diagnostic
        if: inputs.mode == 'pure-repository-debug'
        timeout-minutes: 24
        env:
          STEAD_WORKFLOW: ${{ github.sha }}
          STEAD_RUN_ID: ${{ github.run_id }}
          STEAD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          controller=$(sudo cat /var/lib/stead-ci-controller/.runtime/controller)
          sudo --preserve-env=ACTIONS_ID_TOKEN_REQUEST_URL,ACTIONS_ID_TOKEN_REQUEST_TOKEN python3 -I -B /var/lib/stead-ci-controller/scripts/ci/hosted.py --workflow "$STEAD_WORKFLOW" --controller "$controller" --candidate "$controller" --run-id "$STEAD_RUN_ID" --attempt "$STEAD_ATTEMPT" --mode pure-repository-debug
      - name: Record namespace kernel denial diagnostics
        if: failure()
        run: |
          sudo python3 -I -B - <<'PY'
          import json, subprocess
          result = subprocess.run(['/usr/bin/journalctl', '-k', '--no-pager', '--output=cat',
              '--grep=apparmor=.*comm="(bwrap|python3)"', '--lines=32'],
              capture_output=True, text=True, timeout=10)
          print(json.dumps({'classification': 'kernel-diagnostic-only', 'exit_code': result.returncode,
              'stdout': result.stdout[:32768], 'stderr': result.stderr[:2048],
              'truncated': len(result.stdout) > 32768 or len(result.stderr) > 2048}))
          if result.returncode not in (0, 1):
              raise SystemExit('Kernel diagnostic collection failed')
          PY
      - name: Publish bounded evidence only
        if: always() && inputs.mode != 'model' && inputs.mode != 'pure' && inputs.mode != 'pure-model-simple' && inputs.mode != 'pure-repository-debug' && inputs.mode != 'home-assets-saved8'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/stead-ci-controller/hosted-evidence/*.json
            /var/lib/stead-ci-controller/hosted-evidence/v10-old-predecessor.jam
            /var/lib/stead-ci-controller/hosted-evidence/v10-old-product.jam
          if-no-files-found: error
          retention-days: 7
      - name: Publish fixed model evidence only
        if: always() && inputs.mode == 'model'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-proof-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/stead-ci-controller/model-evidence/owner-report.json
            /var/lib/stead-ci-controller/model-evidence/request.json
            /var/lib/stead-ci-controller/model-evidence/response.bin
            /var/lib/stead-ci-controller/model-evidence/proposal.json
            /var/lib/stead-ci-controller/model-evidence/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish fixed pure evaluator evidence only
        if: always() && (inputs.mode == 'pure' || inputs.mode == 'pure-model-simple' || inputs.mode == 'pure-repository-debug')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pure-evaluator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/stead-ci-controller/pure-evidence/owner-report.json
            /var/lib/stead-ci-controller/pure-evidence/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish fixed saved8 rehearsal evidence only
        if: always() && inputs.mode == 'home-assets-saved8'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saved8-rehearsal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/stead-ci-controller/home-asset-evidence/owner-report.json
            /var/lib/stead-ci-controller/home-asset-evidence/report.json
            /var/lib/stead-ci-controller/home-asset-evidence/inputs.json
            /var/lib/stead-ci-controller/home-asset-evidence/seed8.jam
            /var/lib/stead-ci-controller/home-asset-evidence/seed8.json
            /var/lib/stead-ci-controller/home-asset-evidence/a0-loaded.jam
            /var/lib/stead-ci-controller/home-asset-evidence/a0-loaded.json
            /var/lib/stead-ci-controller/home-asset-evidence/a0-cold.jam
            /var/lib/stead-ci-controller/home-asset-evidence/a0-cold.json
            /var/lib/stead-ci-controller/home-asset-evidence/assets-loaded.jam
            /var/lib/stead-ci-controller/home-asset-evidence/assets-loaded.json
            /var/lib/stead-ci-controller/home-asset-evidence/rollback-loaded.jam
            /var/lib/stead-ci-controller/home-asset-evidence/rollback-loaded.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish fixed saved8 resource control evidence only
        if: always() && inputs.mode == 'home-assets-saved8'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: saved8-control-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /var/lib/stead-ci-controller/hosted-evidence/control-missing-profile-report.json
            /var/lib/stead-ci-controller/hosted-evidence/control-missing-profile-inputs.json
            /var/lib/stead-ci-controller/hosted-evidence/control-wrong-profile-report.json
            /var/lib/stead-ci-controller/hosted-evidence/control-wrong-profile-inputs.json
            /var/lib/stead-ci-controller/hosted-evidence/control-parent-death-report.json
            /var/lib/stead-ci-controller/hosted-evidence/control-parent-death-inputs.json
            /var/lib/stead-ci-controller/hosted-evidence/control-guardian-death-report.json
            /var/lib/stead-ci-controller/hosted-evidence/control-guardian-death-inputs.json
            /var/lib/stead-ci-controller/hosted-evidence/control-changed-limits-report.json
            /var/lib/stead-ci-controller/hosted-evidence/control-changed-limits-inputs.json
            /var/lib/stead-ci-controller/hosted-evidence/control-stale-lease-report.json
            /var/lib/stead-ci-controller/hosted-evidence/control-stale-lease-inputs.json
          if-no-files-found: error
          retention-days: 7
