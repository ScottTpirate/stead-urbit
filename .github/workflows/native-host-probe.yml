name: Native hosted runner inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-host-probe.yml

permissions:
  contents: read

concurrency:
  group: native-host-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect the standard disposable runner
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess
          result = {
              'classification': 'hosted-runner-inventory-only',
              'native_execution': False,
              'qualification': False,
              'system': platform.system(),
              'machine': platform.machine(),
              'kernel': platform.release(),
              'python': platform.python_version(),
              'cpu_affinity': sorted(os.sched_getaffinity(0)),
              'uid': os.getuid(),
              'image': {key: os.environ.get(key) for key in ('ImageOS', 'ImageVersion', 'RUNNER_ENVIRONMENT')},
          }
          for name, arguments in {
              'git': ['git', '--version'],
              'bubblewrap': ['bwrap', '--version'],
              'systemd': ['systemctl', '--version'],
              'openssl': ['openssl', 'version'],
              'iproute': ['ip', '-Version'],
          }.items():
              if not shutil.which(arguments[0]):
                  result[name] = {'available': False}
                  continue
              output = subprocess.run(arguments, capture_output=True, text=True, timeout=5)
              result[name] = {'status': output.returncode, 'version': output.stdout.splitlines()[:2]}
          for name, source in {
              'cgroup_controllers': '/sys/fs/cgroup/cgroup.controllers',
              'unprivileged_userns': '/proc/sys/kernel/unprivileged_userns_clone',
              'apparmor_userns': '/proc/sys/kernel/apparmor_restrict_unprivileged_userns',
          }.items():
              path = pathlib.Path(source)
              result[name] = path.read_text().strip()[:256] if path.is_file() else None
          result['memory_kib'] = int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:')))
          print(json.dumps(result, sort_keys=True, indent=2))
          PY
