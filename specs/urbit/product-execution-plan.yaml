screenshot_ui_commit: dbc8cc0
primary_specification: docs/urbit/PRODUCT_EXPERIENCE_CONTRACT.md
purpose: Convert the current native foundation into one coherent Work, Docs, optional Code and human/agent product.
  These are next-work packages, not replacement URB identifiers or claims of implementation acceptance.
canonical_tracker:
  preserve_ids: URB-000 through URB-280 and M0 through M6
  catalogs:
  - specs/urbit/backlog.json
  - specs/urbit/ecosystem.json
  issue_mapping: Use current ecosystem.json issue_map and inspect live issue state.
  rule: Create linked follow-ups only when implementation work is separately authorized. Do not erase historic acceptance
    or treat a closed parent as accepting new scope.
operating_contract:
  integrator: One lead owns product decisions, shared schemas, migrations and integration.
  concurrency: Lead plus two independent implementation lanes and one independent reviewer.
  worktree_rule: Preserve existing work; inspect current branch and coordinate overlapping edits.
  start_rule: Reconcile current main with reviewed_commit before implementation.
  artifact_rule: A planning document or mock screen does not close a functional acceptance gate.
  architecture:
  - Retain native Hoon Home as authoritative mutation owner.
  - Historical reference/stead Go architecture is not active instruction.
  - Ordinary Git identities and canonical Markdown remain portable.
  - Scoped resource identity includes project, kind, collection when applicable and local ID.
  - Separate accountable owner, worker principal, agent definition/runtime and run/attempt.
  - Separate Work contract revision from comments and operational progress.
  - Retain independent review and current authorization at final acceptance.
  - General projects have zero repositories; agents belong to Work rather than Code.
  - No model or untrusted repository execution on the authority host.
  - No House compatibility claim without verified host contract and installation evidence.
  default_design:
    nav: Workspace Inbox/My work/Search; project Overview/Work/Docs/optional Code.
    scope: Workspace aggregation starts within the selected Home.
    create_work: Current project; Task; To do; No priority; Unassigned; title only required.
    autonomous_owner: Explicit owner or visibly inherited project human steward.
    task_detail: Approximately 560px preview plus full route; no 350px primary workspace.
    document: Read by default; focused Edit; Source available; one canonical Markdown representation.
    review: Common Change envelope with specialized Doc/code diff; independent acceptance.
    agent: Named worker picker and real run; no copied briefs in normal user flow.
    policy: Review required by default; bounded low-risk automatic acceptance added later.
  prohibitions:
  - No blanket rewrite, new orchestration stack, general workflow builder or speculative Gnat migration.
  - No indiscriminate removal of bounds, auth checks or uncertain-outcome semantics.
  - No fake successful run, fabricated evidence or demo fixture presented as native behavior.
  - No shared secrets or worker credentials in prompts, source, logs or clone URLs.
  - No automatic external messages or deployment merely because an agent received a task.
  required_packet_fields:
  - user_outcome
  - current_paths
  - proposed_paths_or_boundaries
  - changes
  - non_goals
  - depends_on
  - acceptance
  - evidence
  definition_of_done:
  - Implement the scoped outcome and relevant UI states on current agreed contracts.
  - Provide exact source revision, dataset/profile, roles, commands and observed results.
  - Separate native integration, mocked tests, static checks and unexecuted cases.
  - Include relevant conflict, access, retry and recovery cases, not only happy path.
  - Independent reviewer validates the task outcome; integrator reconciles into current docs/catalogs.
  - Do not broaden testing after concrete risks and required gates are resolved.
shared_ui_states:
- initial_loading
- incremental_update
- empty
- no_results
- read_only
- dirty_draft
- saving
- accepted
- disconnected_or_stale
- outcome_unknown
- conflict
- permission_revoked
- retryable_error
- unsupported_operation
initial_dispatch:
  tasks:
  - T01
  - T02
  - T06
  - T19
  note: T02/T06/T19 can inspect and prepare in parallel with T01. Shared-contract mutations wait for T01. T19 is
    a bounded current-pilot defect investigation, not forge completion.
